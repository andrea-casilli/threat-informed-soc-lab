name: Bug report
description: Report a reproducible defect in this local lab.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private logs, personal data, or details of vulnerabilities that require private reporting.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include safe, local steps and the expected versus actual result.
    validations:
      required: true
