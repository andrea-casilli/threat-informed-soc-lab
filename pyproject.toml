[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "threat-informed-soc-lab"
version = "0.1.0"
description = "A safe, local threat-informed SOC detection engineering lab"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0,<7.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "ruff>=0.8,<1.0", "mypy>=1.13,<2.0"]

[tool.setuptools.packages.find]
include = ["soc_lab*", "detection_engine*", "parsers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["soc_lab", "parsers", "detection_engine", "scripts"]
